name: Fuzz

on:
  push:
    branches:
      - main
      - release
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/fuzz.yaml'
  pull_request:
    branches:
      - main
      - release
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/fuzz.yaml'
  schedule:
    # Run every night in the repository's local operating timezone. Scheduled
    # workflows themselves execute from the default branch; the job matrix below
    # explicitly checks out and fuzzes both main and release.
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Fuzzing duration per target, for example 30s, 2m, or 5m
        required: false
        default: 2m
        type: string

permissions: {}

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz all targets (${{ matrix.branch || github.base_ref || github.ref_name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # A schedule event always belongs to the default branch. Using a matrix to
        # run the same workflow against both maintained branches. Other events
        # operate on their event SHA and therefore need only one matrix entry.
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main","release"]') || fromJSON('[""]') }}
    env:
      TARGET_BRANCH: ${{ matrix.branch || github.base_ref || github.ref_name }}
      # Automatic runs are configured with repository Actions variables:
      #   FUZZ_NIGHTLY_TIME (default: 2m per target)
      #   FUZZ_PR_TIME      (default: 30s per target)
      # Manual runs use workflow_dispatch.inputs.fuzztime.
      FUZZ_TIME: ${{ github.event_name == 'schedule' && (vars.FUZZ_NIGHTLY_TIME || '2m') || github.event_name == 'pull_request' && (vars.FUZZ_PR_TIME || '30s') || github.event_name == 'workflow_dispatch' && inputs.fuzztime || '15s' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ matrix.branch || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Show fuzz configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Branch: $TARGET_BRANCH"
          echo "Duration per fuzz target: $FUZZ_TIME"

      - name: Discover fuzz targets
        id: fuzz-cache
        shell: bash
        run: |
          set -euo pipefail

          go test -json -run '^$' -list '^Fuzz' ./... |
            jq -r '
              select(.Action == "output")
              | . as $event
              | ($event.Output | rtrimstr("\n")) as $line
              | select($line | test("^Fuzz[A-Za-z0-9_]+$"))
              | [$event.Package, $line]
              | @tsv
            ' > "$RUNNER_TEMP/fuzz-targets.tsv"

          if [[ ! -s "$RUNNER_TEMP/fuzz-targets.tsv" ]]; then
            echo 'No fuzz targets found.'
            exit 1
          fi

          mapfile -d '' -t fuzz_files < <(
            git grep -lz -E \
              'func[[:space:]]+Fuzz[A-Za-z0-9_]*[[:space:]]*\(' \
              -- '*_test.go' | sort -z
          )

          if (( ${#fuzz_files[@]} == 0 )); then
            echo 'Could not identify the source files containing fuzz targets.'
            exit 1
          fi

          schema="$({
            for file in "${fuzz_files[@]}"; do
              printf '%s\0' "$file"
              sha256sum "$file"
            done
          } | sha256sum | cut -d ' ' -f 1)"

          scope="${TARGET_BRANCH//\//-}"

          echo "go-version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

          echo 'Discovered fuzz targets:'
          sed 's/^/  /' "$RUNNER_TEMP/fuzz-targets.tsv"

      - name: Restore generated fuzz corpus
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.fuzz-cache.outputs.path }}
          key: fuzz-${{ runner.os }}-go-${{ steps.fuzz-cache.outputs.go-version }}-${{ steps.fuzz-cache.outputs.schema }}-${{ steps.fuzz-cache.outputs.scope }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ runner.os }}-go-${{ steps.fuzz-cache.outputs.go-version }}-${{ steps.fuzz-cache.outputs.schema }}-${{ steps.fuzz-cache.outputs.scope }}-
            fuzz-${{ runner.os }}-go-${{ steps.fuzz-cache.outputs.go-version }}-${{ steps.fuzz-cache.outputs.schema }}-

      - name: Run fuzz targets
        shell: bash
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r package target; do
            echo "::group::${package}/${target}"
            go test "$package" \
              -run '^$' \
              -fuzz "^${target}$" \
              -fuzztime "$FUZZ_TIME" \
              -fuzzminimizetime 30s \
              -timeout 15m
            echo '::endgroup::'
          done < "$RUNNER_TEMP/fuzz-targets.tsv"

      - name: Collect failing fuzz inputs
        if: failure() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail

          destination="$RUNNER_TEMP/fuzz-failures"
          mkdir -p "$destination"

          while IFS= read -r -d '' file; do
            mkdir -p "$destination/$(dirname "$file")"
            cp "$file" "$destination/$file"
          done < <(
            git ls-files -z \
              --others \
              --modified \
              --exclude-standard \
              -- ':(glob)**/testdata/fuzz/**'
          )

      - name: Upload failing fuzz inputs
        if: failure() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures-${{ env.TARGET_BRANCH }}-${{ github.run_id }}
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore
          retention-days: 30

      # Pull requests may restore the base branch corpus, but they deliberately do
      # not publish a new shared cache. Only trusted push, schedule, and manual
      # runs advance the persistent generated corpus.
      - name: Save generated fuzz corpus
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.fuzz-cache.outputs.path }}
          key: fuzz-${{ runner.os }}-go-${{ steps.fuzz-cache.outputs.go-version }}-${{ steps.fuzz-cache.outputs.schema }}-${{ steps.fuzz-cache.outputs.scope }}-${{ github.run_id }}
