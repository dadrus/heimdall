services:
  heimdall-init:
    image: alpine/openssl:3.5.9@sha256:e8a2319d15637db5296c0ff540bb028cfabc480b22fcdd4a020582393d32673f
    entrypoint: ["/bin/sh"]
    command: /tmp/generate_keys.sh
    volumes:
      - ./generate_keys.sh:/tmp/generate_keys.sh:ro
      - heimdall-keys:/etc/heimdall/keys

  heimdall:
    image: dadrus/heimdall:0.17.28
    depends_on:
      heimdall-init:
        condition: service_completed_successfully
    volumes:
    - ./heimdall-config.yaml:/etc/heimdall/config.yaml:ro
    - ./upstream-rules.yaml:/etc/heimdall/rules.yaml:ro
    - heimdall-keys:/etc/heimdall/keys:ro

  upstream:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    command: --port=8081

  idp:
    image: nginx:1.31.6@sha256:60f0d4e986561e08804f75c211dcaf7fc5455699eada29f42cbe8a0a7253dd86
    volumes:
    - ./idp.nginx:/etc/nginx/nginx.conf:ro
    - ./jwks.json:/var/www/nginx/jwks.json:ro

  opa:
    image: openpolicyagent/opa:1.21.2@sha256:7459fa69661242c8983d6e4116779550cbb17608f1110ddcd4e9e24da4dcb0e5
    command: run --server --addr=0.0.0.0:8181 /etc/opa/policies
    volumes:
    - ./policy.rego:/etc/opa/policies/policy.rego:ro

volumes:
  heimdall-keys:

