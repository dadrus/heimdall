services:
  proxy:
    image: envoyproxy/envoy:v1.39.3@sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865
    volumes:
    - ./envoy-config-grpc.yaml:/envoy.yaml:ro
    ports:
    - "9090:9090"
    command: -c /envoy.yaml

  heimdall:
    command: serve decision -c /etc/heimdall/config.yaml --insecure --envoy-grpc

