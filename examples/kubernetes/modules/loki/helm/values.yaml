# Lightweight kind configuration: one instance, no bundled MinIO/caches.
# S3 credentials are expanded inside Loki from its Kubernetes Secret at runtime.
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: ${bucket_name}
      ruler: ${bucket_name}
      admin: ${bucket_name}
    s3:
      endpoint: ${s3_endpoint}
      s3ForcePathStyle: true
      insecure: false
%{ if s3_ca_config_map_name != "" ~}
      http_config:
        ca_file: /etc/s3-ca/ca.crt
%{ endif ~}
      accessKeyId: $${AWS_ACCESS_KEY_ID}
      secretAccessKey: $${AWS_SECRET_ACCESS_KEY}
  limits_config:
    allow_structured_metadata: true

deploymentMode: Monolithic
singleBinary:
  replicas: 1
  persistence:
    enabled: false
    dataVolumeParameters:
      emptyDir: {}
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: ${s3_secret_name}
%{ if s3_ca_config_map_name != "" ~}
  extraVolumes:
    - name: s3-ca
      configMap:
        name: ${s3_ca_config_map_name}
  extraVolumeMounts:
    - name: s3-ca
      mountPath: /etc/s3-ca
      readOnly: true
%{ endif ~}

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: true

test:
  enabled: false
lokiCanary:
  enabled: false
