# Lightweight kind configuration: one instance, no bundled MinIO/caches.
# S3 credentials are expanded inside Loki from the monitoring Secret at runtime.
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: ${bucket_name}
      ruler: ${bucket_name}
      admin: ${bucket_name}
    s3:
      endpoint: ${s3_endpoint}
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true  # local cluster uses HTTP to RustFS
      accessKeyId: $${AWS_ACCESS_KEY_ID}
      secretAccessKey: $${AWS_SECRET_ACCESS_KEY}
  limits_config:
    allow_structured_metadata: true

deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  persistence:
    enabled: false
  # Loki needs writable local scratch space even when using RustFS for S3.
  # Keep it ephemeral for the local kind example.
  extraVolumes:
    - name: loki-scratch
      emptyDir: {}
  extraVolumeMounts:
    - name: loki-scratch
      mountPath: /var/loki
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: heimdall-rustfs-s3

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: true

test:
  enabled: false
lokiCanary:
  enabled: false
