apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: echo-app
  namespace: ${namespace}
spec:
  dnsNames:
    - echo-app
    - echo-app.${namespace}
    - echo-app.${namespace}.svc
    - echo-app.${namespace}.svc.${cluster_domain}
    - echo-app.local
  secretName: echo-app
  issuerRef:
    name: root-ca-issuer
    kind: ClusterIssuer