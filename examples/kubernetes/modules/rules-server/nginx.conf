worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/rules-server-tls/tls.crt;
        ssl_certificate_key /etc/rules-server-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Readiness does not depend on the Echo-App rules being published.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /rules/echo-app.yaml {
            alias /srv/rules/echo-app.yaml;
            default_type application/yaml;
            add_header Cache-Control "no-store" always;
        }

        location / {
            return 404;
        }
    }
}
