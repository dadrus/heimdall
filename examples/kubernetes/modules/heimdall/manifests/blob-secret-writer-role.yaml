apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heimdall-blob-secret-writer
  namespace: ${namespace}
rules:
  # The Kubernetes API cannot restrict Secret creation to a resource name;
  # updates are restricted to the single intended Secret.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [${secret_name}]
    verbs: [patch]
