apiVersion: batch/v1
kind: Job
metadata:
  name: heimdall-sync-blob-s3
  namespace: ${namespace}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata: {}
    spec:
      serviceAccountName: heimdall-blob-secret-sync
      automountServiceAccountToken: true
      restartPolicy: Never
      containers:
        - name: sync
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
                # No shell tracing or output containing Secret data.
                access_key="$(base64 /rustfs/RUSTFS_ACCESS_KEY | tr -d '\n')"
                secret_key="$(base64 /rustfs/RUSTFS_SECRET_KEY | tr -d '\n')"
                curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                  --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                  -H 'Content-Type: application/apply-patch+yaml' \
                  -X PATCH --data-binary @- \
                  'https://kubernetes.default.svc/api/v1/namespaces/${heimdall_namespace}/secrets/${secret_name}?fieldManager=heimdall-blob-rustfs-sync' \
                  >/dev/null <<EOF_SECRET
                apiVersion: v1
                kind: Secret
                metadata:
                  name: ${secret_name}
                  namespace: ${heimdall_namespace}
                type: Opaque
                data:
                  AWS_ACCESS_KEY_ID: $access_key
                  AWS_SECRET_ACCESS_KEY: $secret_key
                EOF_SECRET
                echo 'S3 credentials available in Heimdall namespace'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: rustfs
              mountPath: /rustfs
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: rustfs
          secret:
            secretName: ${rustfs_secret_name}
