tempo:
  retention: 24h
  # Tempo expands these references after reading environment variables
  # from the monitoring Secret. Values/state contain placeholders only.
  extraArgs:
    "-config.expand-env": "true"
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: heimdall-rustfs-s3
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: heimdall-rustfs-s3
          key: AWS_SECRET_ACCESS_KEY
  storage:
    trace:
      backend: s3
      s3:
        bucket: ${bucket_name}
        endpoint: ${replace(replace(s3_endpoint, "http://", ""), "https://", "")}
        region: us-east-1
        access_key: $${AWS_ACCESS_KEY_ID}
        secret_key: $${AWS_SECRET_ACCESS_KEY}
        insecure: ${startswith(s3_endpoint, "http://")}
        forcepathstyle: true

  metricsGenerator:
    enabled: true
    remoteWriteUrl: "${prometheus_url}/api/v1/write"

  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
