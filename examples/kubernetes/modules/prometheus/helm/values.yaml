kube-state-metrics:
  enabled: true
alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  persistentVolume:
    enabled: false
  service:
    servicePort: 9090
  extraFlags:
    - web.enable-remote-write-receiver
    - web.enable-lifecycle
    - log.format=json