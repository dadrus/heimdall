apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-rustfs
spec:
  conditions:
    - namespaces: [heimdall, monitoring]
  provider:
    kubernetes:
      remoteNamespace: ${rustfs_namespace}
      server:
        # kind's Kubernetes API uses a cluster-internal CA, not system roots.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: ${rustfs_namespace}
          key: ca.crt
      auth:
        serviceAccount:
          name: rustfs-eso-reader
          namespace: ${rustfs_namespace}
