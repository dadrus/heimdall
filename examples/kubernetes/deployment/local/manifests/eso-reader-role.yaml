apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rustfs-eso-reader
  namespace: ${namespace}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # ESO validates the store by performing a SelfSubjectRulesReview.
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
