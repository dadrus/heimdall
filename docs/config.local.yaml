# Overrides for `just run-docs` only.
params:
  version: dev
  version_file: /data.json
  search_index_file: /index.json
  path_prefix: ""

module:
  mounts:
    - source: /tmp/heimdall-doc-versions
      target: static
    - source: openapi
      target: static
    - source: bootstrap/dist/js/bootstrap.bundle.js
      target: assets/js/bootstrap.bundle.js
    - source: bootstrap-icons/font/fonts
      target: static/css/fonts
