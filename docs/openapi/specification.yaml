  /{path_and_query_params}:
    servers:
      - url: https://heimdall.proxy.local
        description: Main Service
    get:
      summary: Main endpoint
      description: |
        Handles requests on the main service. Any request path can be evaluated, and all HTTP methods are supported.
        Headers and cookies are available to matching rules and rule mechanisms.
      tags:
        - Main Service
      operationId: get_proxy
      parameters:
        - name: path_and_query_params
          in: path
          description: Request path and query string used for rule matching and request processing.
          schema:
            type: string
        - name: X-Forwarded-Method
          in: header
          description: |
            For requests from trusted proxies, overrides the HTTP method used for rule matching. If omitted, heimdall
            uses the method of the incoming request.
          schema:
            type: string
        - name: X-Forwarded-Proto
          in: header
          description: |
            For requests from trusted proxies, overrides the URL scheme used for rule matching. If omitted, heimdall
            derives the scheme from the incoming connection.
          schema:
            type: string
        - name: X-Forwarded-Host
          in: header
          description: |
            For requests from trusted proxies, overrides the host used for rule matching. If omitted, heimdall uses
            the host of the incoming request.
          schema:
            type: string
        - name: X-Forwarded-Uri
          in: header
          description: |
            For requests from trusted proxies, overrides the path and query string used for rule matching. If omitted,
            heimdall uses the URI of the incoming request.
          schema:
            type: string
        - name: X-Forwarded-For
          in: header
          description: |
            For requests from trusted proxies, provides the client IP chain in `X-Forwarded-For` format. heimdall uses
            it when no client addresses are available from the `Forwarded` header.
          schema:
            type: string
        - name: Forwarded
          in: header
          description: |
            For requests from trusted proxies, provides client address information using the standard `Forwarded`
            header. heimdall reads `for=` parameters and prefers them over `X-Forwarded-For`.
          schema:
            type: string
        - name: <Application Specific>
          in: header
          description: Placeholder for application-specific headers referenced by configured rules.
          schema:
            type: string
        - name: <Application Specific>
          in: cookie
          description: Placeholder for application-specific cookies referenced by configured rules.
          schema:
            type: string
      responses:
        '200':
          description: |
            Returned when heimdall accepts the request. In proxy mode, heimdall forwards the request and returns the
            upstream response. In decision mode, heimdall returns the decision response.
        '400':
          description: |
            Bad Request. Returned when the evaluated request path contains `.` or `..` dot segments, including
            dot-segment sequences that combine plain or URL-encoded dots with encoded slash or backslash separators.
        '401':
          description: Unauthorized. Returned when heimdall cannot authenticate the subject for the matched rule.
        '403':
          description: Forbidden. Returned when heimdall cannot authorize the subject for the matched rule.
        '404':
          description: Not Found. Returned when no rule matches the request.
        '405':
          description: Method Not Allowed. Returned when the matched rule does not allow the requested HTTP method.
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '431':
          $ref: '#/components/responses/RequestHeaderFieldsTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: |
            Bad Gateway. Returned when communication with a dependent system fails, for example because of DNS,
            connection, or timeout errors.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
