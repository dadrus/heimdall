openapi: 3.1.0

info:
  title: heimdall
  version: x-current-version
  description: API reference for heimdall.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
    url: https://github.com/dadrus/heimdall/blob/main/LICENSE

servers:
  - url: https://heimdall.management.local
    description: Management Server

tags:
  - name: Well-Known
    description: |
      Operations and resources under the `.well-known` URI space defined by
      [RFC 8615](https://www.rfc-editor.org/rfc/rfc8615), including the health and JWKS endpoints.

      These endpoints are available only on heimdall's **management port**.

  - name: Main
    description: |
      Main service exposed by heimdall on the **main port**.

  - name: Profiling
    description: |
      Provides runtime profiling information, including CPU, memory, goroutine, and execution trace profiles.

      This information is available only on heimdall's **profiling port**.

  - name: Metrics
    description: |
      Provides Prometheus-style metrics, including:

      * Process information such as CPU, memory, file descriptor usage, and start time.
      * Go runtime information, including garbage collection, goroutines, and OS threads.
      * Metrics endpoint information, including collection errors and scrape counts.
      * Decision and proxy request metrics, including HTTP request counts, durations, and in-progress requests.
      * Expiry information for configured certificates.

      These metrics are available only on heimdall's **metrics port**.

  - name: Kubernetes Admission Controller
    description: |
      Provides a [validating admission webhook](https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/)
      and a [conversion webhook](https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definition-versioning/#webhook-conversion)
      for integration with the Kubernetes API server.

      The validation webhook reports invalid `RuleSet` resources directly during admission, without requiring operators
      to inspect heimdall's logs. The conversion webhook converts `RuleSet` resources between supported CRD versions.

      This functionality is available only in Kubernetes environments.
x-tagGroups:
  - name: Management
    tags:
      - Well-Known
  - name: Main
    tags:
      - Main Service
  - name: Profiling
    tags:
      - Profiling
  - name: Metrics
    tags:
      - Metrics
  - name: Kubernetes Admission Controller
    tags:
      - Kubernetes Admission Controller

components:
  schemas:
    ETag:
      description: |
        The `ETag` response header identifies a specific version of a resource. Clients can use it for conditional
        requests, allowing the server to avoid resending unchanged content.
        Example: `ETag: "33a64df551425fcc55e4d42a148795d9f25f89d4"`.
      type: string

    If-None-Match:
      description: |
        Carries an `ETag` value previously returned by the server. Clients use it to request the resource only if
        it has changed. Example: `If-None-Match: "33a64df551425fcc55e4d42a148795d9f25f89d4"`.
      type: string

    HealthStatus:
      title: Health status
      description: Health status of a heimdall instance.
      type: object
      properties:
        status:
          description: Current health status.
          type: string

    JWKS:
      title: JSON Web Key Set
      description: JSON Web Key Set (JWKS) containing public keys used to verify JSON Web Tokens (JWTs).
      type: object
      required:
        - keys
      properties:
        keys:
          description: |
            Array of JSON Web Keys (JWKs). The order does not imply preference unless an application defines
            its own ordering semantics.
          type: array
          items:
            type: object
            required:
              - kty
            properties:
              crv:
                description: |
                  Name of the elliptic curve for an EC key. See
                  [RFC 7518](https://www.rfc-editor.org/rfc/rfc7518) for details.
                type: string
              x:
                description: X coordinate of the elliptic-curve public key, if this is an EC key.
                type: string
              y:
                description: Y coordinate of the elliptic-curve public key, if this is an EC key.
                type: string
              n:
                description: |
                  Modulus of the RSA public key, if this is an RSA key. See
                  [RFC 7518](https://www.rfc-editor.org/rfc/rfc7518) for details.
                type: string
              e:
                description: Exponent of the RSA public key, if this is an RSA key.
                type: string
              kty:
                description: Cryptographic algorithm family of the key, such as `RSA` or `EC`.
                type: string
              use:
                description: Intended use of the public key, such as `sig` for signing or `enc` for encryption.
                type: string
              key_ops:
                description: Operations for which the key is intended to be used.
                type: string
              alg:
                description: Algorithm intended for use with the key.
                type: string
              kid:
                description: Identifier of the key.
                type: string
              x5u:
                description: |
                  URI that refers to an X.509 public key certificate or certificate chain. See
                  [RFC 3986](https://www.rfc-editor.org/rfc/rfc3986) and
                  [RFC 5280](https://www.rfc-editor.org/rfc/rfc5280).
                type: string
                format: uri
              x5c:
                description: |
                  X.509 certificate chain represented as a JSON array of base64-encoded certificate strings. See
                  [RFC 5280](https://www.rfc-editor.org/rfc/rfc5280).
                type: array
                items:
                  type: string
              x5t:
                description: |
                  Base64url-encoded SHA-1 thumbprint of the DER-encoded X.509 certificate. See
                  [RFC 5280](https://www.rfc-editor.org/rfc/rfc5280).
                type: string
              x5t#S256:
                description: |
                  Base64url-encoded SHA-256 thumbprint of the DER-encoded X.509 certificate. See
                  [RFC 5280](https://www.rfc-editor.org/rfc/rfc5280).
                type: string

  responses:
    NotModified:
      description: Not Modified. Returned when `If-None-Match` matches the current `ETag` value.
    ContentTooLarge:
      description: Content Too Large. Returned when the request body exceeds the configured maximum size.
    RequestHeaderFieldsTooLarge:
      description: Request Header Fields Too Large. Returned when the request headers exceed the configured maximum size.
    ServiceUnavailable:
      description: Service Unavailable. Returned when heimdall's request admission capacity is exhausted.
    InternalServerError:
      description: Internal Server Error. Returned when an internal error prevents the request from being served.

security: []

paths:
  /metrics:
    servers:
      - url: https://metrics.heimdall.local
        description: Metrics Service
    get:
      summary: Get Prometheus-style metrics
      description: |
        Returns the available metrics. The `/metrics` path is configurable and may differ between deployments.
      tags:
        - Metrics
      operationId: metrics_get
      responses:
        '200':
          description: Available metrics.
          content:
            text/html:
              schema:
                type: string

  /debug/pprof:
    servers:
      - url: https://profiling.heimdall.local
        description: Profiling Service
    get:
      summary: Get available profiles
      description: Lists the available profiles.
      tags:
        - Profiling
      operationId: pprof_list
      responses:
        '200':
          description: Available profiles.
          content:
            text/html:
              schema:
                type: string

  /debug/pprof/{profile_name}:
    servers:
      - url: https://profiling.heimdall.local
        description: Profiling Service
    get:
      summary: Get profiling samples for a specific profile
      description: Returns profiling information for the requested profile.
      tags:
        - Profiling
      operationId: pprof_get
      parameters:
        - name: profile_name
          description: |
            Defines which profile to retrieve. The following profiles are available:

            * `allocs` - A sampling of all past memory allocations.
            * `block` - Stack traces that led to blocking on synchronization primitives.
            * `cmdline` - The command-line invocation of the current program, with arguments separated by NUL bytes.
            * `goroutine` - Stack traces of all current goroutines.
            * `heap` - A sampling of memory allocations of live objects.
            * `mutex` - Stack traces of holders of contended mutexes.
            * `profile` - CPU profile. Profiling lasts for the duration specified by `seconds`, or 30 seconds if omitted.
            * `symbol` - Looks up program counters from the request and maps them to function names.
            * `threadcreate` - Stack traces that led to the creation of new OS threads.
            * `trace` - Execution trace in binary form. Tracing lasts for the duration specified by `seconds`, or 1 second if omitted.
          in: path
          required: true
          schema:
            type: string
        - name: seconds
          description: |
            Sampling duration. Ignored if the selected profile does not support sampling.

            For `profile`, the default is 30 seconds. For `trace`, the default is 1 second.
          in: query
          required: false
          schema:
            type: integer
        - name: gc
          description: |
            For the `heap` profile, specifies whether to run garbage collection before sampling.
            Any value greater than `0` triggers garbage collection.
          in: query
          required: false
          schema:
            type: integer
        - name: debug
          description: |
            Controls whether the profile is rendered as text instead of in `profile.proto` format.
            Any value greater than `0` enables text output.
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: |
            Requested profiling information. If `debug` is greater than `0`, the response MIME type is `text/html`;
            otherwise, it is `application/octet-stream`.
          headers:
            X-Content-Type-Options:
              description: Set to `nosniff`.
              schema:
                type: string
            Content-Disposition:
              description: |
                Set to `attachment; filename="<profile name>"`.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
        '400':
          description: Bad Request. Returned when the requested sampling duration exceeds the server's write timeout.
        '404':
          description: Not Found. Returned when the requested profile is unknown or unsupported.

  /.well-known/health:
    servers:
      - url: https://heimdall.management.local
        description: Management Server
    get:
      description: |
        Returns the health status of a heimdall instance.
      tags:
        - Well-Known
      operationId: well_known_health
      summary: Get health status
      responses:
        '200':
          description: Current health status of a heimdall instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        '431':
          $ref: '#/components/responses/RequestHeaderFieldsTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /.well-known/jwks:
    servers:
      - url: https://heimdall.management.local
        description: Management Server
    get:
      description: |
        Returns the keys used to verify JWTs issued by heimdall as a JSON Web Key Set (JWKS), as defined by
        [RFC 7517](https://www.rfc-editor.org/rfc/rfc7517). The endpoint uses
        [ETag](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/ETag) for caching.

        The returned key set depends on heimdall's key store configuration. If no key is configured, heimdall
        returns a single JWK for the key generated at startup. Otherwise, the response contains one JWK for each
        configured key. If a key includes certificates, the corresponding `x5c` certificate chain is included as well.
      tags:
        - Well-Known
      summary: Get JWT verification keys (JWKS)
      operationId: well_known_jwks
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/If-None-Match'
      responses:
        '200':
          description: JWKS containing verification keys and, when configured, certificate chains.
          headers:
            ETag:
              schema:
                $ref: '#/components/schemas/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
              example:
                keys:
                  - use: sig
                    kty: EC
                    kid: foo
                    crv: P-384
                    alg: ES384
                    x: 0WuRhXd8TpGy8Xn3zDT3xkkS7Ua66QQSK69gWxPHw7k1tZyQXsUuEudYDb_vwN9f
                    y: _CBaqh43zjEowNq1wZcrMr-bdeDHdz17iVSkJKYonUzDFeyuiHETAQrYcqDT_8mG
                    x5c:
                      - ""
                      - ""
                      - ""
                  - use: sig
                    kty: EC
                    kid: bar
                    crv: P-384
                    alg: ES384
                    x: F47uZNn_QtqKXcxsYsJSc5asaqEPxVuc2sIVLzR2dRDi29tdA_X7phRX9kGhDnOO
                    y: elcChdCImsIaRT7xVLslehBpVaWKlNnCSTPhJLYXwcB1dS24bpUkwAiVijejZ0J0
        '304':
          $ref: '#/components/responses/NotModified'
        '431':
          $ref: '#/components/responses/RequestHeaderFieldsTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /validate:
    servers:
      - url: https://heimdall.decision.kuberetes.svc
        description: Kubernetes Admission Controller
    post:
      summary: Validate `RuleSet` resources
      description: |
        Validates `RuleSet` resources contained in a Kubernetes
        [AdmissionReview](https://kubernetes.io/docs/reference/config-api/apiserver-admission.v1/#admission-k8s-io-v1-AdmissionReview)
        request, as defined by the
        [Kubernetes admission webhook specification](https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/).
      tags:
        - Kubernetes Admission Controller
      operationId: admission_controller_validate_ruleset
      parameters:
        - name: timeout
          description: |
            Maximum time allowed for validation. The value must match `^[0-9]+(ns|us|ms|s|m|h)$`.
          in: query
          required: false
          schema:
            type: string
          example: 5s
      requestBody:
        description: |
          A Kubernetes
          [AdmissionReview](https://kubernetes.io/docs/reference/config-api/apiserver-admission.v1/#admission-k8s-io-v1-AdmissionReview)
          request containing the `RuleSet` to validate.
        required: true
        content:
          application/json:
            example: {
              "kind": "AdmissionReview",
              "apiVersion": "admission.k8s.io/v1",
              "request": {
                "uid": "ce409862-eae0-4704-b7d5-46634efdaf9b",
