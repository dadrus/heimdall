      responses:
        '200':
          description: |
            A Kubernetes [AdmissionReview](https://kubernetes.io/docs/reference/config-api/apiserver-admission.v1/#admission-k8s-io-v1-AdmissionReview)
            response containing the validation decision for the submitted `RuleSet`.
          content:
            application/json:
              example: {
                "kind":"AdmissionReview",
                "apiVersion":"admission.k8s.io/v1",
                "response": {
                  "uid":"ce409862-eae0-4704-b7d5-46634efdaf9b",
                  "allowed":true,
                  "status":{
                    "metadata":{},
                    "status":"Success",
                    "message":"RuleSet valid",
                    "code":200
                  }
                }
              }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{path_and_query_params}:
    get:
      summary: Process an HTTP request
      description: |
        This operation represents heimdall's main HTTP request interface. It is
        not limited to `GET`. All other HTTP verbs are also supported and are subject
        to the configured rules. Method-specific HTTP semantics
        still apply: HEAD responses have no body, and configured CORS preflight
        OPTIONS requests can be handled without rule evaluation.

        Requests may have nested paths and query strings. The path placeholder
        shown above is illustrative: it does not express a single-segment
        restriction on the requests that heimdall can process.

        Response statuses and bodies depend on the matching rule and operating
        mode. In proxy mode, the upstream service determines the response, so
        its status codes are not limited to the examples listed below.

        `X-Forwarded-*` and `Forwarded` headers are trusted only when the
        sender matches the configured
        [`trusted_proxies`](/docs/services/main/#_trusted_proxies).
        Additional application-specific headers and cookies can be evaluated
        by the configured rules.
      tags:
        - Main Service
      operationId: get_proxy
      parameters:
        - name: path_and_query_params
          in: path
          required: true
          description: |
            Actual requested path, including any nested segments and optional
            query string, to be evaluated against the configured rules.
          schema:
            type: string
        - name: X-Forwarded-Method
          in: header
          description: |
            HTTP method to use for rule evaluation. Defaults to the method of
            the request received by heimdall when this header is absent.
          schema:
            type: string
        - name: X-Forwarded-Proto
          in: header
          description: |
            HTTP scheme to use when evaluating the request URL. When absent,
            heimdall uses the scheme of the incoming request.
          schema:
            type: string
        - name: X-Forwarded-Host
          in: header
          description: Original request host to use when evaluating the request URL.
          schema:
            type: string
        - name: X-Forwarded-Uri
          in: header
          description: Original request path and query string to use for rule evaluation.
          schema:
            type: string
        - name: X-Forwarded-For
          in: header
          description: Client IP address information supplied by a trusted proxy.
          schema:
            type: string
        - name: Forwarded
          in: header
          description: Standardized information about the original request and its proxy forwarding chain.
          schema:
            type: string
      responses:
        '200':
          description: |
            A successful decision normally returns HTTP 200 in decision mode,
            unless a different status is configured. In proxy mode, an authorized
            request is forwarded and the upstream service determines the response
            status and body; HTTP 200 is only one possible result.
        '400':
          description: |
            Bad Request. Returned if the evaluated request path contains dot segments (`.` or `..`), including
            URL-encoded variants (case-insensitive), e.g. `%2e`, `%2f`, and `%5c` combinations, to prevent path traversal.
        '401':
          description: Unauthorized. Returned if a matching rule could not verify the authentication status of the subject related to the request.
        '403':
          description: Forbidden. Returned if a matching rule could not verify the authorization status of the subject related to the request.
        '404':
          description: Not Found. Returned if there was no rule found, which could be used to verify the request.
        '405':
          description: Method Not Allowed. Returned if the matched rule does not permit the HTTP method.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: |
            Bad Gateway. Returned if communication with an upstream service
            fails, for example because of DNS or timeout errors.
