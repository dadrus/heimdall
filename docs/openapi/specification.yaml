    post:
      summary: Convert `RuleSet` resources
      description: |
        Converts `RuleSet` resources between supported CRD schema versions. The resources are supplied in a Kubernetes
        [ConversionReview](https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definition-versioning/#conversionreview-request-0)
        request, as defined by the Kubernetes webhook conversion specification.
      tags:
        - Kubernetes Admission Controller
      operationId: admission_controller_convert_ruleset
      parameters:
        - name: timeout
          description: |
            Maximum time allowed for conversion. The value must match `^[0-9]+(ns|us|ms|s|m|h)$`.
          in: query
          required: false
          schema:
            type: string
          example: 5s
