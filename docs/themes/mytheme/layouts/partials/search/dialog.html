{{- $search := partialCached "search/index-data.html" .Site }}
<doc-search class="modal" id="docSearch" tabindex="-1" aria-label="Search documentation" aria-hidden="true"
            index-file="{{ .Site.Params.search_index_file }}" index-hash="{{ $search.hash }}"
            path-prefix="{{ .Site.Params.path_prefix }}">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header p-2">
            <div class="input-group">
              <div class="input-group-text bg-body border-0 fs-4">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search text-secondary my-0" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                  </svg>
              </div>
              <input id="search-input" class="form-control search-bar border-0" type="search" placeholder="Search documentation "
                     aria-label="Search docs..." aria-describedby="search-navigation-help" autocomplete="off" autofocus>
              <div class="input-group-text bg-body border-0">
                <button type="button"
                        class="btn input-group-text text-muted border p-1 bg-light-subtle fs-7 font-monospace"
                        data-bs-dismiss="modal"
                        aria-label="Close search">ESC</button>
              </div>
            </div>

          </div>
          <div  class="modal-body">
            <div class="search-results">
              <p class="text-center mt-5">No recent searches</p>
            </div>
            <span id="search-navigation-help" class="visually-hidden">Use the up and down arrow keys to select a result, then Enter to open it.</span>
            <span id="search-result-status" class="visually-hidden" role="status" aria-live="polite"></span>
          </div>
          <div class="modal-footer docs-search-footer">
            <div class="docs-search-footer__item">
              <span class="docs-search-footer__keys" aria-hidden="true"><kbd>↑</kbd><kbd>↓</kbd></span>
              <span>Navigate</span>
            </div>
            <div class="docs-search-footer__item">
              <kbd aria-hidden="true">↵</kbd>
              <span>Open</span>
            </div>
          </div>
        </div>
    </div>
</doc-search>
