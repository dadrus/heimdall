<head>
  <title>{{ .Title }}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Site.Params.description }}" />
  <meta name="dc.relation" content="{{ .Site.BaseURL }}" />
  <meta name="theme-color" content="#1A94D2" />
  {{- if eq .Kind "404" }}
  <base href="{{ printf "%s/" .Site.Params.path_prefix | absURL }}">
  {{- end }}

  {{- $options := dict
    "targetPath" "css/styles.css"
    "outputStyle" "compressed"
    "transpiler" "dartsass"
    "includePaths" (slice "node_modules")
  -}}
  {{- $style := resources.Get "sass/main.scss" | css.Sass $options | minify -}}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" media="screen">

  <!--
      include a favicon for your site if you have it, else omit the line below
      Location of favicon can be in mytheme/static/favicon.ico
  -->
  <link rel='shortcut icon' type='image/x-icon' href='/favicon.ico' />

</head>
