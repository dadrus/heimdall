suite: test suite for configmap configuration
templates:
  - configmap.yaml
tests:
  - it: should be configured by default
    asserts:
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1

  - it: name should be set with default name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-heimdall-config

  - it: name should be set with overwritten name
    release:
      name: test-release
    set:
      nameOverride: foo
    asserts:
      - equal:
          path: metadata.name
          value: test-release-foo-config

  - it: namespace should be set
    release:
      namespace: test-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: test-namespace

  - it: should set default labels with default values
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: heimdall
            app.kubernetes.io/version: latest
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: heimdall-*

  - it: should not have any annotations
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should include default entries if nothing is specified
    asserts:
      - equal:
          path: data["heimdall.yaml"]
          value:
            |-
            serve:
              port: 4456
            management:
              port: 4457
            profiling:
              enabled: false
              host: 0.0.0.0
              port: 10251

  - it: should allow configuration of any heimdall setting
    set:
      secret_management:
        tls_keys:
          type: pem
          config:
            path: /path/to/keystore.pem
            password: VeryInsecure!
            watch: true
        jwt_keys:
          type: pem
          config:
            path: /path/to/signing.pem
            password: VeryInsecure!
            watch: true
      shutdown:
        timeout: 45s
      serve:
        host: 127.0.0.1
        requests:
          max_in_flight: 222
          read_timeout: 34s
          headers:
            max_size: 32KB
            read_timeout: 4s
          body:
            max_size: 6MB
            read_idle_timeout: 21s
            read_min_rate: 1234
        responses:
          write_timeout: 35s
          write_idle_timeout: 36s
          write_min_rate: 2345
        connections:
          max: 111
          idle_timeout: 31s
          write_idle_timeout: 32s
          streams:
            max_concurrent: 101
          liveness:
            probe_after: 33s
            probe_timeout: 7s
        upstream:
          connections:
            max_per_host: 10
            max_idle: 20
            max_idle_per_host: 15
            dial_timeout: 3s
            idle_timeout: 1m
            write_idle_timeout: 5s
            liveness:
              probe_after: 6s
              probe_timeout: 7s
          responses:
            headers:
              max_size: 2MB
              read_timeout: 8s
        tls:
          secret:
            source: tls_keys
            selector: key1
        trusted_proxies:
          - 192.168.1.0/24
        respond:
          verbose: true
          with:
            authentication_error:
              code: 404
            authorization_error:
              code: 404
            request_body_too_large:
              code: 413
      management:
        host: 127.0.0.1
        requests:
          max_in_flight: 333
          read_timeout: 37s
          headers:
            max_size: 8KB
            read_timeout: 3s
          body:
            max_size: 2MB
        responses:
          write_timeout: 38s
          write_idle_timeout: 39s
          write_min_rate: 3456
        connections:
          max: 444
          idle_timeout: 40s
        tls:
          secret:
            source: tls_keys
            selector: key2
      metrics:
        enabled: true
      profiling:
        host: 192.168.2.10
        port: 9999
      tracing:
        enabled: true
        span_processor: batch
      log:
        level: debug
        format: gelf
      mechanisms:
        authenticators:
          - id: deny_all
            type: unauthorized
          - id: anon
            type: anonymous
          - id: jwt_auth
            type: jwt
            config:
              jwks_endpoint: http://idp:8080/.well-known/jwks
              assertions:
                issuers:
                  - demo_issuer
        authorizers:
          - id: opa
            type: remote
            config:
              endpoint: http://opa:8181/v1/data/{{ .Values.policy }}
              payload: "{}"
              expressions:
                - expression: |
                    Payload.result == true
        finalizers:
          - id: create_jwt
            type: jwt
            config:
              signer:
                secret:
                  source: jwt_keys
                  selector: key1
          - id: noop
            type: noop
      default_rule:
        execute:
          - authenticator: deny_all
          - finalizer: create_jwt
      providers:
        file_system:
          src: /etc/heimdall/rules.yaml
          watch: true
        http_endpoint:
          endpoints:
            - url: http://foo.bar/ruleset1
        cloud_blob:
          buckets:
            - url: gs://my-bucket
        kubernetes:
          auth_class: foo
          tls:
            secret:
              source: tls_keys
              selector: key3
    asserts:
      - equal:
          path: data["heimdall.yaml"]
          value:
            |-
            secret_management:
              jwt_keys:
                config:
                  password: VeryInsecure!
                  path: /path/to/signing.pem
                  watch: true
                type: pem
              tls_keys:
                config:
                  password: VeryInsecure!
                  path: /path/to/keystore.pem
                  watch: true
                type: pem
            shutdown:
              timeout: 45s
            serve:
              connections:
                idle_timeout: 31s
                liveness:
                  probe_after: 33s
                  probe_timeout: 7s
                max: 111
                streams:
                  max_concurrent: 101
                write_idle_timeout: 32s
              host: 127.0.0.1
              port: 4456
              requests:
                body:
                  max_size: 6MB
                  read_idle_timeout: 21s
                  read_min_rate: 1234
                headers:
                  max_size: 32KB
                  read_timeout: 4s
                max_in_flight: 222
                read_timeout: 34s
              respond:
                verbose: true
                with:
                  authentication_error:
                    code: 404
                  authorization_error:
                    code: 404
                  request_body_too_large:
                    code: 413
              responses:
                write_idle_timeout: 36s
                write_min_rate: 2345
                write_timeout: 35s
              tls:
                secret:
                  selector: key1
                  source: tls_keys
              trusted_proxies:
              - 192.168.1.0/24
              upstream:
                connections:
                  dial_timeout: 3s
                  idle_timeout: 1m
                  liveness:
                    probe_after: 6s
                    probe_timeout: 7s
                  max_idle: 20
                  max_idle_per_host: 15
                  max_per_host: 10
                  write_idle_timeout: 5s
                responses:
                  headers:
                    max_size: 2MB
                    read_timeout: 8s
            management:
              connections:
                idle_timeout: 40s
                max: 444
              host: 127.0.0.1
              port: 4457
              requests:
                body:
                  max_size: 2MB
                headers:
                  max_size: 8KB
                  read_timeout: 3s
                max_in_flight: 333
                read_timeout: 37s
              responses:
                write_idle_timeout: 39s
                write_min_rate: 3456
                write_timeout: 38s
              tls:
                secret:
                  selector: key2
                  source: tls_keys
            log:
              format: gelf
              level: debug
            metrics:
              enabled: true
            tracing:
              enabled: true
              span_processor: batch
            profiling:
              enabled: false
              host: 192.168.2.10
              port: 9999
            mechanisms:
              authenticators:
              - id: deny_all
                type: unauthorized
              - id: anon
                type: anonymous
              - config:
                  assertions:
                    issuers:
                    - demo_issuer
                  jwks_endpoint: http://idp:8080/.well-known/jwks
                id: jwt_auth
                type: jwt
              authorizers:
              - config:
                  endpoint: http://opa:8181/v1/data/{{ .Values.policy }}
                  expressions:
                  - expression: |
                      Payload.result == true
                  payload: '{}'
                id: opa
                type: remote
              finalizers:
              - config:
                  signer:
                    secret:
                      selector: key1
                      source: jwt_keys
                id: create_jwt
                type: jwt
              - id: noop
                type: noop
            default_rule:
              execute:
              - authenticator: deny_all
              - finalizer: create_jwt
            providers:
              cloud_blob:
                buckets:
                - url: gs://my-bucket
              file_system:
                src: /etc/heimdall/rules.yaml
                watch: true
              http_endpoint:
                endpoints:
                - url: http://foo.bar/ruleset1
              kubernetes:
                auth_class: foo
                tls:
                  secret:
                    selector: key3
                    source: tls_keys
